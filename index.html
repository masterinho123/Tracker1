<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Recharts dependencies -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <!-- Supabase for direct sync (GitHub Pages) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: {
                            50: '#f9fafb', 100: '#f3f4f6', 200: '#e5e7eb', 300: '#d1d5db', 400: '#9ca3af',
                            500: '#6b7280', 600: '#4b5563', 700: '#374151', 800: '#1f2937', 900: '#111827',
                        },
                        green: { 400: '#4ade80', 500: '#22c55e' }
                    }
                }
            }
        }

        // Inline translations for index.html (before app.js loads)
        const lang = localStorage.getItem('tracker_language') || 'it';
        const indexMsgs = {
            it: { loading: "Caricamento del tracker... Se la pagina rimane bianca, verifica la console (F12).", error: "Errore nel caricamento di app.js" },
            en: { loading: "Loading tracker... If the page stays white, check the console (F12).", error: "Error loading app.js" },
            fr: { loading: "Chargement du tracker... Si la page reste blanche, vérifiez la console (F12).", error: "Erreur lors du chargement de app.js" },
            de: { loading: "Tracker wird geladen... Wenn die Seite weiß bleibt, prüfe die Konsole (F12).", error: "Fehler beim Laden von app.js" }
        };
        window.INDEX_T = indexMsgs[lang] || indexMsgs.it;
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 3s linear infinite;
        }
        body {
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="root">
        <!-- Skeleton Loader -->
        <div class="flex min-h-screen bg-[#0f172a] animate-pulse">
            <!-- Sidebar Skeleton -->
            <div class="w-14 md:w-16 bg-[#1e293b] border-r border-slate-800 flex flex-col items-center py-6 gap-6">
                <div class="w-8 h-8 bg-slate-700 rounded-lg"></div>
                <div class="w-6 h-6 bg-slate-700 rounded-md mt-4"></div>
                <div class="w-6 h-6 bg-slate-700 rounded-md"></div>
                <div class="w-6 h-6 bg-slate-700 rounded-md"></div>
                <div class="mt-auto w-6 h-6 bg-slate-700 rounded-full mb-4"></div>
            </div>

            <!-- Main Content Skeleton -->
            <div class="flex-1 p-4 md:p-8 overflow-hidden">
                <div class="max-w-[1400px] mx-auto space-y-4">
                    <!-- Header Card Skeleton -->
                    <div class="h-[140px] bg-[#1e293b] rounded-xl border border-slate-800 p-4 flex flex-col justify-between mb-4">
                        <div class="flex justify-between items-start">
                            <div class="space-y-2">
                                <div class="w-48 h-6 bg-slate-700 rounded"></div>
                                <div class="w-32 h-4 bg-slate-700/50 rounded"></div>
                            </div>
                            <div class="flex gap-2">
                                <div class="w-20 h-8 bg-slate-700 rounded-full"></div>
                                <div class="w-20 h-8 bg-slate-700 rounded-full"></div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between">
                                <div class="w-24 h-3 bg-slate-700/50 rounded"></div>
                                <div class="w-12 h-3 bg-slate-700/50 rounded"></div>
                            </div>
                            <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                                <div class="w-1/3 h-full bg-slate-700"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 3 Small Cards Skeleton -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-3 mb-4">
                        <!-- Monthly Trend -->
                        <div class="h-[140px] bg-[#1e293b] rounded-xl border border-slate-800 p-2.5 flex flex-col">
                            <div class="w-24 h-3 bg-slate-700 rounded mb-1 uppercase text-[10px]"></div>
                            <div class="flex-1 w-full bg-slate-800/50 rounded-lg relative overflow-hidden">
                                <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-slate-700/20 to-transparent"></div>
                                <div class="absolute bottom-4 left-0 w-full h-[2px] bg-slate-700/30"></div>
                            </div>
                        </div>
                        <!-- Completion Gauge -->
                        <div class="h-[140px] bg-[#1e293b] rounded-xl border border-slate-800 p-2.5 flex flex-col items-center justify-center">
                            <div class="w-24 h-3 bg-slate-700 self-start mb-1 uppercase text-[10px]"></div>
                            <div class="relative w-20 h-20">
                                <div class="w-full h-full rounded-full border-[6px] border-slate-800"></div>
                                <div class="absolute inset-0 rounded-full border-[6px] border-transparent border-t-slate-700 animate-spin-slow"></div>
                                <div class="absolute inset-0 flex items-center justify-center">
                                    <div class="w-8 h-4 bg-slate-700 rounded"></div>
                                </div>
                            </div>
                        </div>
                        <!-- Weekly Averages -->
                        <div class="h-[140px] bg-[#1e293b] rounded-xl border border-slate-800 p-2.5 flex flex-col">
                            <div class="w-24 h-3 bg-slate-700 rounded mb-1 uppercase text-[10px]"></div>
                            <div class="flex-1 grid grid-cols-4 gap-2 items-end px-2">
                                <div class="h-[20%] bg-slate-700 rounded-sm"></div>
                                <div class="h-[40%] bg-slate-700/50 rounded-sm"></div>
                                <div class="h-[60%] bg-slate-700/50 rounded-sm"></div>
                                <div class="h-[30%] bg-slate-700/50 rounded-sm"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Habit Grid Header Skeleton -->
                    <div class="h-10 bg-[#1e293b] rounded-xl border border-slate-800 flex items-center px-4 gap-4 mt-4">
                        <div class="w-32 h-4 bg-slate-700 rounded"></div>
                        <div class="flex-1 flex gap-1 justify-end">
                            <div class="w-6 h-6 bg-slate-800 rounded"></div>
                            <div class="w-6 h-6 bg-slate-800 rounded"></div>
                            <div class="w-6 h-6 bg-slate-800 rounded"></div>
                        </div>
                    </div>

                    <!-- Habit Grid Rows Skeleton -->
                    <div class="space-y-2">
                        <div class="h-12 bg-[#1e293b]/50 rounded-xl border border-slate-800/50 flex items-center px-4 gap-4">
                            <div class="w-6 h-6 bg-slate-700 rounded-full"></div>
                            <div class="w-32 h-4 bg-slate-700/50 rounded"></div>
                            <div class="flex-1"></div>
                            <div class="w-24 h-4 bg-slate-800 rounded"></div>
                        </div>
                        <div class="h-12 bg-[#1e293b]/50 rounded-xl border border-slate-800/50 flex items-center px-4 gap-4">
                            <div class="w-6 h-6 bg-slate-700 rounded-full"></div>
                            <div class="w-32 h-4 bg-slate-700/50 rounded"></div>
                            <div class="flex-1"></div>
                            <div class="w-24 h-4 bg-slate-800 rounded"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script type="text/babel" data-presets="env,react">
        window.APP_BASE_PATH = window.location.pathname;
    </script>
    <script type="text/babel" data-presets="env,react" src="app.js?v=32" onerror="alert(window.INDEX_T.error)"></script>
    
    <script>
        window.addEventListener('load', () => {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    // Logga l'errore solo se non siamo in locale (dove spesso fallisce per HTTPS)
                    if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                        console.error('ServiceWorker registration failed: ', err);
                    }
                });
            }
        });
    </script>
</body>
</html>
